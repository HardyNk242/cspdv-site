# Publie le site sur GitHub Pages à chaque envoi sur `main`.
#
# Le site n'a AUCUNE dépendance : pas de npm install, pas de node_modules.
# Le générateur est un seul fichier Node qui écrit du HTML dans site/.
# La publication prend une vingtaine de secondes.
name: Publier le site

on:
  push:
    branches: [main]
  workflow_dispatch: # relancer à la main depuis l'onglet Actions

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  construire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Régénère le HTML depuis donnees/. Le dossier site/ est aussi
      # versionné : même si cette étape cassait, le site publié
      # précédemment resterait consultable dans le dépôt.
      - run: node construire.js

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  publier:
    needs: construire
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - id: deploiement
        uses: actions/deploy-pages@v4
